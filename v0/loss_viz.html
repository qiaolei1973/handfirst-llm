<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 梯度下降可视化</title>
<script src="/chart.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:#f8fafc; color:#1e293b; min-height:100vh; padding:20px; }
  .container { max-width:1100px; margin:0 auto; }

  .header { text-align:center; margin-bottom:16px; }
  .header h1 { font-size:1.3rem; font-weight:700; }
  .header p { font-size:0.8rem; color:#64748b; margin-top:2px; }

  /* 控制栏 */
  .controls { display:flex; justify-content:center; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .controls button {
    padding:7px 16px; border-radius:6px; border:1px solid #e2e8f0; background:#fff;
    cursor:pointer; font-size:0.82rem; color:#475569; transition:all 0.15s;
  }
  .controls button:hover { background:#f1f5f9; }
  .controls button.primary { background:#6366f1; color:#fff; border-color:#6366f1; }
  .controls button.primary:hover { background:#4f46e5; }
  .controls button.running { background:#ef4444; color:#fff; border-color:#ef4444; }
  .speed-label { font-size:0.78rem; color:#94a3b8; }

  /* 状态栏 */
  .status-bar {
    display:flex; justify-content:center; gap:24px; flex-wrap:wrap;
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:10px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .stat { text-align:center; }
  .stat .lbl { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.05em; color:#94a3b8; }
  .stat .val { font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .val.w { color:#3b82f6; }
  .stat .val.bias { color:#f59e0b; }
  .stat .val.loss { color:#ef4444; }
  .stat .val.epoch { color:#6366f1; }

  /* 主图 */
  .main-chart-card {
    background:#fff; border:1px solid #e2e8f0; border-radius:12px;
    padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .main-chart-card h2 { font-size:0.85rem; color:#475569; margin-bottom:6px; }
  .main-chart-card canvas { width:100%; height:380px; }

  /* 底部：Loss曲线 + 梯度曲线 */
  .bottom-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:750px) { .bottom-row { grid-template-columns:1fr; } }
  .mini-card {
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:12px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .mini-card h3 { font-size:0.8rem; color:#475569; margin-bottom:4px; }
  .mini-card canvas { width:100%; height:200px; }

  /* 公式 */
  .formula-card {
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:14px 20px; box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .formula-card h3 { font-size:0.8rem; color:#475569; margin-bottom:8px; }
  .formula-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
  .fm { font-family:monospace; font-size:0.82rem; padding:8px 12px; background:#f1f5f9; border-radius:6px; }
  .fm .nm { color:#3b82f6; font-weight:700; }
  .fm .er { color:#ef4444; font-weight:700; }
  .fm .gr { color:#22c55e; font-weight:700; }
  .fm .go { color:#f59e0b; font-weight:700; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎯 梯度下降可视化教学</h1>
    <p>绿色虚线 = 数据背后的真实函数 y=2x+10（带±3噪声） · 紫色实线 = 模型当前学到的 · 红色线段 = loss（误差）</p>
  </div>

  <div class="controls">
    <button class="primary" id="btnPlay" onclick="togglePlay()">▶ 开始训练</button>
    <button onclick="stepOne()">⏭ 单步</button>
    <button onclick="reset()">🔄 重置</button>
    <span class="speed-label">速度:</span>
    <input type="range" id="speed" min="1" max="20" value="5" style="width:80px;" oninput="updateSpeed()">
    <span id="speedLbl" class="speed-label">5x</span>
  </div>

  <div class="status-bar">
    <div class="stat">
      <div class="lbl">Epoch</div>
      <div class="val epoch" id="statEpoch">0</div>
    </div>
    <div class="stat">
      <div class="lbl">Loss (MSE)</div>
      <div class="val loss" id="statLoss">—</div>
    </div>
    <div class="stat">
      <div class="lbl">W</div>
      <div class="val w" id="statW">1.000</div>
    </div>
    <div class="stat">
      <div class="lbl">Bias</div>
      <div class="val bias" id="statBias">0.000</div>
    </div>
    <div class="stat">
      <div class="lbl">|gradW|</div>
      <div class="val" id="statGW" style="color:#3b82f6;">—</div>
    </div>
    <div class="stat">
      <div class="lbl">|gradBias|</div>
      <div class="val" id="statGB" style="color:#f59e0b;">—</div>
    </div>
  </div>

  <div class="main-chart-card">
    <h2>📊 数据 + 模型 + 误差</h2>
    <canvas id="mainChart"></canvas>
  </div>

  <div class="bottom-row">
    <div class="mini-card">
      <h3>📉 Loss 曲线</h3>
      <canvas id="lossChart"></canvas>
    </div>
    <div class="mini-card">
      <h3>📐 梯度衰减</h3>
      <canvas id="gradChart"></canvas>
    </div>
  </div>

  <div class="formula-card">
    <h3>🧮 实时公式</h3>
    <div class="formula-grid" id="formulaBox"></div>
  </div>
</div>

<script>
// ===== 颜色 =====
const C = {
  blue:'#3b82f6', amber:'#f59e0b', red:'#ef4444', purple:'#6366f1',
  green:'#22c55e', gray:'#94a3b8', grayLight:'#e2e8f0',
};

// ===== 数据生成 =====
const N = 15;
const TRUE_W = 2, TRUE_BIAS = 10, NOISE = 3;
const rawX = Array.from({length:N}, (_,i) => i);
const labels = rawX.map(x => TRUE_W * x + TRUE_BIAS + (Math.random() - 0.5) * 2 * NOISE);

// 归一化参数
const xMean = rawX.reduce((a,b)=>a+b,0)/rawX.length;
const xStd = Math.sqrt(rawX.reduce((s,x)=>s+(x-xMean)**2,0)/rawX.length);
const xNorm = rawX.map(x => (x - xMean) / xStd);

// ===== 训练状态 =====
let W = 1, bias = 0;
let epoch = 0;
let playing = false;
let timer = null;
let speed = 5; // epochs per tick
let lossHistory = [];
let gradWHistory = [];
let gradBHistory = [];

// ===== Chart.js =====
function makeLineChart(canvasId, extra={}) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type:'line',
    data:{datasets:[]},
    options:{
      responsive:false, maintainAspectRatio:false,
      animation:false,
      interaction:{intersect:false, mode:'index'},
      plugins:{legend:{labels:{usePointStyle:true,pointStyleWidth:8,padding:16,font:{size:10}}}},
      scales:{
        x:{type:'linear',grid:{color:'#f1f5f9'},ticks:{font:{size:9},color:C.gray},...extra.x},
        y:{grid:{color:'#f1f5f9'},ticks:{font:{size:9},color:C.gray},...extra.y},
      },
      ...extra.opt,
    },
  });
}

// ---- 主图：散点 + 两根线 + 误差线段 ----
const mainCtx = document.getElementById('mainChart').getContext('2d');

// 误差线插件 —— 画当前预测点和真实点之间的垂直线段
const errorPlugin = {
  id: 'errorLines',
  afterDraw(chart) {
    const state = chart.options.plugins._state;
    if (!state) return;
    const {rawX, labels, W, bias} = state;
    const xAxis = chart.scales.x;
    const yAxis = chart.scales.y;
    const ctx = chart.ctx;

    for (let i = 0; i < rawX.length; i++) {
      const x = xAxis.getPixelForValue(rawX[i]);
      const yTrue = yAxis.getPixelForValue(labels[i]);
      const yPred = yAxis.getPixelForValue(rawX[i] * W + bias);
      if (x===undefined||yTrue===undefined||yPred===undefined) continue;

      const diff = Math.abs(yTrue - yPred);
      if (diff < 2) continue; // 太小不画

      // 误差线段
      ctx.save();
      ctx.strokeStyle = 'rgba(239,68,68,0.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      ctx.moveTo(x, yTrue);
      ctx.lineTo(x, yPred);
      ctx.stroke();
      ctx.restore();
    }
  }
};

const mainChart = new Chart(mainCtx, {
  type:'scatter',
  data:{
    datasets:[
      {
        label:'训练数据 (y=2x+10 ± 3)',
        data: rawX.map((x,i)=>({x, y:labels[i]})),
        backgroundColor:C.gray, pointRadius:5, pointHoverRadius:7,
      },
      {
        label:'真实函数 y=2x+10',
        data:[{x:0,y:TRUE_BIAS},{x:N-1,y:TRUE_W*(N-1)+TRUE_BIAS}],
        borderColor:'rgba(34,197,94,0.5)', borderDash:[8,4], borderWidth:2,
        pointRadius:0, showLine:true, tension:0,
      },
      {
        label:'模型当前 y=Wx+bias',
        data:[{x:0,y:0},{x:N-1,y:1}], // 动态更新
        borderColor:C.purple, borderWidth:2.5,
        pointRadius:0, showLine:true, tension:0,
      },
    ],
  },
  options:{
    responsive:false, maintainAspectRatio:false,
    animation:false,
    interaction:{intersect:false, mode:'index'},
    plugins:{
      legend:{labels:{usePointStyle:true,pointStyleWidth:8,padding:16,font:{size:10}}},
      _state:{rawX, labels, W, bias},
    },
    scales:{
      x:{type:'linear', title:{display:true,text:'x',color:C.gray}, grid:{color:'#f1f5f9'}, ticks:{font:{size:9},color:C.gray}},
      y:{title:{display:true,text:'y',color:C.gray}, grid:{color:'#f1f5f9'}, ticks:{font:{size:9},color:C.gray}},
    },
  },
  plugins:[errorPlugin],
});

// ---- 底部 loss 曲线 ----
const lossChart = makeLineChart('lossChart', {
  x:{min:0,max:600,title:{display:true,text:'Epoch',color:C.gray}},
  y:{title:{display:true,text:'MSE Loss',color:C.gray},beginAtZero:true},
});
lossChart.data.datasets = [{
  label:'Loss', data:[], borderColor:C.red, backgroundColor:C.red+'18',
  borderWidth:2, pointRadius:0, fill:true, tension:0.3,
}];

// ---- 底部梯度曲线 ----
const gradChart = makeLineChart('gradChart', {
  x:{min:0,max:600,title:{display:true,text:'Epoch',color:C.gray}},
  y:{title:{display:true,text:'|梯度|',color:C.gray}},
});
gradChart.data.datasets = [
  {label:'|gradW|', data:[], borderColor:C.blue, borderWidth:2, pointRadius:0, tension:0.3},
  {label:'|gradBias|', data:[], borderColor:C.amber, borderWidth:2, pointRadius:0, tension:0.3},
];

// ===== 一次训练迭代 =====
function oneEpoch() {
  // 用归一化 x 训练（内部），但展示用原始空间参数
  const idx = Math.floor(Math.random() * N);
  const xn = xNorm[idx];
  const yTrue = labels[idx];
  const yPred = xn * W + bias;
  const diff = yPred - yTrue;
  const loss = diff * diff;
  const gradW_norm = 2 * diff * xn;
  const gradBias_norm = 2 * diff;

  const lr = 0.01;
  W -= lr * gradW_norm;
  bias -= lr * gradBias_norm;

  // 转换到原始空间用于展示
  const W_raw = W / xStd;
  const bias_raw = bias - W * xMean / xStd;
  const gradW_raw = gradW_norm * xStd;
  const gradBias_raw = gradBias_norm;

  return {W_raw, bias_raw, loss, gradW:gradW_raw, gradBias:gradBias_raw, xIdx:idx, x:rawX[idx], yTrue, yPred:rawX[idx]*W_raw+bias_raw};
}

// ===== UI 更新 =====
function updateUI(result) {
  epoch++;
  const {W_raw, bias_raw, loss, gradW, gradBias} = result;

  // 状态栏
  document.getElementById('statEpoch').textContent = epoch;
  document.getElementById('statLoss').textContent = loss.toFixed(4);
  document.getElementById('statW').textContent = W_raw.toFixed(3);
  document.getElementById('statBias').textContent = bias_raw.toFixed(3);
  document.getElementById('statGW').textContent = Math.abs(gradW).toFixed(4);
  document.getElementById('statGB').textContent = Math.abs(gradBias).toFixed(4);

  // 主图模型线
  mainChart.data.datasets[2].data = [
    {x:0, y:bias_raw},
    {x:N-1, y:W_raw*(N-1)+bias_raw},
  ];
  mainChart.options.plugins._state = {rawX, labels, W:W_raw, bias:bias_raw};

  // Loss 曲线
  lossHistory.push({x:epoch, y:loss});
  lossChart.data.datasets[0].data = lossHistory;

  // 梯度曲线
  gradWHistory.push({x:epoch, y:Math.abs(gradW)});
  gradBHistory.push({x:epoch, y:Math.abs(gradBias)});
  gradChart.data.datasets[0].data = gradWHistory;
  gradChart.data.datasets[1].data = gradBHistory;

  // 每 3 epoch 刷画布
  if (epoch % 3 === 0) {
    mainChart.update('none');
    lossChart.update('none');
    gradChart.update('none');
  }
  if (epoch === 1 || epoch % 20 === 0) updateFormula(result);
}

function updateFormula(r) {
  document.getElementById('formulaBox').innerHTML = `
    <div class="fm">
      预测: ŷ = <span class="nm">${r.W_raw.toFixed(3)}</span> · x +
               <span class="nm">${r.bias_raw.toFixed(3)}</span>
    </div>
    <div class="fm">
      真实: y = ${TRUE_W} · x + ${TRUE_BIAS}
    </div>
    <div class="fm">
      误差: ŷ − y = <span class="er">${(r.yPred - r.yTrue).toFixed(3)}</span>
    </div>
    <div class="fm">
      loss = (ŷ − y)² = <span class="er">${(r.yPred - r.yTrue).toFixed(3)}</span>² =
      <span class="er">${((r.yPred - r.yTrue)**2).toFixed(6)}</span>
    </div>
    <div class="fm">
      ∂loss/∂W = 2x(ŷ − y) = 2·${r.x}·${(r.yPred - r.yTrue).toFixed(3)} =
      <span class="gr">${r.gradW.toFixed(4)}</span>
    </div>
    <div class="fm">
      ∂loss/∂bias = 2(ŷ − y) = 2·${(r.yPred - r.yTrue).toFixed(3)} =
      <span class="gr">${r.gradBias.toFixed(4)}</span>
    </div>
    <div class="fm">
      W ← W − lr·gradW = ${r.W_raw.toFixed(3)} − 0.01·${r.gradW.toFixed(4)} =
      <span class="go">${(r.W_raw - 0.01 * r.gradW).toFixed(3)}</span>
    </div>
    <div class="fm">
      bias ← bias − lr·gradBias = ${r.bias_raw.toFixed(3)} − 0.01·${r.gradBias.toFixed(4)} =
      <span class="go">${(r.bias_raw - 0.01 * r.gradBias).toFixed(3)}</span>
    </div>`;
}

// ===== 控制 =====
function runTick() {
  for (let i=0; i<speed; i++) {
    if (epoch >= 600) { stop(); break; }
    const r = oneEpoch();
    updateUI(r);
  }
}

function togglePlay() {
  if (playing) { stop(); return; }
  playing = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  document.getElementById('btnPlay').classList.add('running');
  timer = setInterval(runTick, 80); // 80ms per batch
}

function stop() {
  playing = false;
  if (timer) clearInterval(timer);
  document.getElementById('btnPlay').textContent = '▶ 开始训练';
  document.getElementById('btnPlay').classList.remove('running');
}

function stepOne() {
  if (playing) stop();
  if (epoch >= 600) return;
  updateUI(oneEpoch());
  // Step 时全刷
  mainChart.update('none');
  lossChart.update('none');
  gradChart.update('none');
}

function reset() {
  stop();
  W = 1; bias = 0; epoch = 0;
  lossHistory = []; gradWHistory = []; gradBHistory = [];
  mainChart.data.datasets[2].data = [{x:0,y:0},{x:N-1,y:N-1}];
  mainChart.options.plugins._state = {rawX, labels, W:1, bias:0};
  lossChart.data.datasets[0].data = [];
  gradChart.data.datasets[0].data = [];
  gradChart.data.datasets[1].data = [];
  mainChart.update(); lossChart.update(); gradChart.update();
  document.getElementById('statEpoch').textContent = '0';
  document.getElementById('statLoss').textContent = '—';
  document.getElementById('statW').textContent = '1.000';
  document.getElementById('statBias').textContent = '0.000';
  document.getElementById('statGW').textContent = '—';
  document.getElementById('statGB').textContent = '—';
  document.getElementById('formulaBox').innerHTML =
    '<div class="fm" style="color:#94a3b8;">按 ▶ 开始训练，或点 ⏭ 单步查看</div>';
}
function updateSpeed() {
  speed = parseInt(document.getElementById('speed').value);
  document.getElementById('speedLbl').textContent = speed + 'x';
}

// 初始
updateFormula({W_raw:1, bias_raw:0, loss:0, gradW:0, gradBias:0, xIdx:0, x:0, yTrue:TRUE_BIAS, yPred:0});
</script>
</body>
</html>
